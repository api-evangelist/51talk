name: 51Talk
description: '51Talk is an online English-language education platform that connects learners with
  certified teachers through one-on-one live video lessons. Founded in 2011 and listed on the NYSE,
  the company operates across 90+ countries with a large base of accredited teachers, delivering a
  structured curriculum and ready-made teaching materials for both children and adult learners.
  Following a strategic shift, 51Talk focuses on international markets outside mainland China,
  including the Philippines and the broader Southeast Asia region, and recruits teachers globally.
  It is a consumer education company backed by DCM Ventures; as of this profile it publishes no
  public developer API, SDK, or documentation surface, so this repo carries only identity and
  domain-security signals.'
